apiVersion: v1
kind: ServiceAccount
metadata:
  name: tunnelrs-operator
  namespace: tunnelrs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tunnelrs-operator
  namespace: tunnelrs
rules:
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes", "ingressroutetcps"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["tlsroutes"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tunnelrs-operator
  namespace: tunnelrs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tunnelrs-operator
subjects:
  - kind: ServiceAccount
    name: tunnelrs-operator
    namespace: tunnelrs
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tunnelrs-operator
  namespace: tunnelrs
data:
  operator.toml: |
    key_path = "/etc/tunnelrs/key/key"
    namespace = "tunnelrs"

    [server]
    id = "SERVER_ID"
    addrs = ["tunnelrs.tunnelrs.svc.cluster.local:7842"]

    [service]
    name = "tunnelrs"
    http_port = 8080
    tls_port = 8443

    [modes]
    terminate = { template = "traefik-ingressroute" }
    passthrough = { template = "traefik-ingressroutetcp" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunnelrs-operator
  namespace: tunnelrs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tunnelrs-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tunnelrs-operator
    spec:
      serviceAccountName: tunnelrs-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: ghcr.io/luukblankenstijn/tunnelrs/operator:main
          args: ["--config", "/etc/tunnelrs/config/operator.toml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: config, mountPath: /etc/tunnelrs/config, readOnly: true }
            - { name: key, mountPath: /etc/tunnelrs/key, readOnly: true }
      volumes:
        - name: config
          configMap:
            name: tunnelrs-operator
        - name: key
          secret:
            secretName: tunnelrs-operator-key
