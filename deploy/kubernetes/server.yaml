apiVersion: v1
kind: Namespace
metadata:
  name: tunnelrs
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tunnelrs-server
  namespace: tunnelrs
data:
  server.toml: |
    key_path = "/etc/tunnelrs/key/key"
    database = "/var/lib/tunnelrs/state.db"
    http_listen = "0.0.0.0:8080"
    tls_listen = "0.0.0.0:8443"

    [iroh]
    bind = "0.0.0.0:7842"

    [[admin_keys]]
    id = "OPERATOR_ID"
    role = "watcher"

    [[admin_keys]]
    id = "CTL_ID"
    role = "admin"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tunnelrs-server
  namespace: tunnelrs
spec:
  serviceName: tunnelrs
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tunnelrs-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tunnelrs-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/luukblankenstijn/tunnelrs/server:main
          args: ["--config", "/etc/tunnelrs/config/server.toml"]
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
            - { name: tls, containerPort: 8443, protocol: TCP }
            - { name: iroh, containerPort: 7842, protocol: UDP }
          readinessProbe:
            tcpSocket:
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: config, mountPath: /etc/tunnelrs/config, readOnly: true }
            - { name: key, mountPath: /etc/tunnelrs/key, readOnly: true }
            - { name: state, mountPath: /var/lib/tunnelrs }
      volumes:
        - name: config
          configMap:
            name: tunnelrs-server
        - name: key
          secret:
            secretName: tunnelrs-server-key
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tunnelrs
  namespace: tunnelrs
spec:
  selector:
    app.kubernetes.io/name: tunnelrs-server
  ports:
    - { name: http, port: 8080, targetPort: http, protocol: TCP }
    - { name: tls, port: 8443, targetPort: tls, protocol: TCP }
    - { name: iroh, port: 7842, targetPort: iroh, protocol: UDP }
---
apiVersion: v1
kind: Service
metadata:
  name: tunnelrs-iroh
  namespace: tunnelrs
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: tunnelrs-server
  ports:
    - { name: iroh, port: 7842, targetPort: iroh, protocol: UDP }
