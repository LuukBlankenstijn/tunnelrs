[workspace]
resolver = "3"
members = ["crates/proto", "crates/server", "crates/connector", "crates/ctl", "crates/operator"]

[workspace.package]
version = "0.1.1"
edition = "2024"

[workspace.dependencies]
tunnelrs-proto = { path = "crates/proto" }
anyhow = "1.0.104"
arc-swap = "1.9.3"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto"] }
iroh = "1.4.1"
k8s-openapi = { version = "0.28.0", features = ["latest"] }
kube = { version = "4.2.0", features = ["runtime", "client", "rustls-tls"] }
notify = "8"
rand = "0.10.3"
remoc = { version = "0.20.4", default-features = false, features = ["rch", "robs", "rtc", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1"
toml-file-refs = "0.1.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
