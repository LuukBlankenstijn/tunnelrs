name: Build and push to Cachix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - uses: cachix/cachix-action@v17
        with:
          name: luukblankenstijn
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: >
          nix build --print-build-logs
          .#tunnelrs-server .#tunnelrs-connector .#tunnelrs-ctl .#tunnelrs-operator
          .#checks.x86_64-linux.tests .#checks.x86_64-linux.clippy .#checks.x86_64-linux.module
          .#devShells.x86_64-linux.default.inputDerivation
