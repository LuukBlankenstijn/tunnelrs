name: Build and push to Cachix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: luukblankenstijn
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: >
          nix build --print-build-logs
          .#tunnelrs-server .#tunnelrs-connector .#tunnelrs-ctl .#tunnelrs-operator
          .#checks.x86_64-linux.tests .#checks.x86_64-linux.clippy .#checks.x86_64-linux.module
          .#devShells.x86_64-linux.default.inputDerivation
